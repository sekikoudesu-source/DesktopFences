name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags, e.g., v1.0.0, v2.1.3

jobs:
  build:
    name: Build Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Change to your preferred Python version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller pywin32
          # Add any other missing dependencies here if needed
          
      - name: Build Executable with PyInstaller
        run: pyinstaller DesktopFences.spec --clean

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopFences
          path: dist/DesktopFences.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesktopFences
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: DesktopFences.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
